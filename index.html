<!DOCTYPE html>

<head>

<title>Asta AS Pinta</title>
<style>
:root{
  --bg:#ECEEF2; --card:#FFFFFF; --ink:#1A1F2B; --muted:#646C7D; --line:#D6DAE3;
  --pinta:#3E1D5C; --pinta-2:#7B3FB0; --go:#15784A; --warn:#A66A00; --stop:#A8261D; --own:#2458B8; --gone:#7A8190;
  --r-lg:18px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--pinta);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 10px}
header.top .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top b{font-size:17px;margin-right:auto;letter-spacing:.2px}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.pill strong{font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:140px;border:0;background:none;padding:10px 2px 9px;font-size:12px;color:var(--muted)}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--pinta-2);font-weight:600}
h2{font-size:21px;margin:18px 0 10px}
h3{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border-radius:var(--r-lg);padding:14px;margin:10px 0;border:1px solid var(--line)}
.search{padding:12px 0 6px}
.search input{width:100%;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--pinta-2);background:#fff;outline:none}
.results{margin:4px 0 0;padding:0;list-style:none}
.results li button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:6px 0}
.results .nm{font-weight:600}
.results .meta{color:var(--muted);font-size:13px}
.results .tag{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.go{--c:var(--go)} .warn{--c:var(--warn)} .stop{--c:var(--stop)} .must{--c:var(--pinta-2)} .own{--c:var(--own)} .gone{--c:var(--gone)}
.dot{background:var(--c)} .tag{color:var(--c)}
.verdict{background:var(--c);color:#fff;border-radius:var(--r-lg);padding:16px 18px;margin:12px 0 8px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px}
.verdict .who{font-size:15px;opacity:.9;grid-column:1/-1}
.verdict .what{font-size:26px;font-weight:700;line-height:1.1}
.verdict .price{font-size:64px;font-weight:800;line-height:.9;text-align:right}
.verdict .price small{display:block;font-size:13px;font-weight:600;opacity:.85;text-align:right}
.verdict .tip{grid-column:1/-1;font-size:14px;background:rgba(255,255,255,.16);border-radius:10px;padding:7px 10px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:6px 0}@media (min-width:700px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts div{border-bottom:1px solid var(--line);padding:5px 0}
.facts dt{font-size:12px;color:var(--muted)} .facts dd{margin:0;font-weight:600}
.note{color:#333;font-size:15px;margin:10px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;background:#fff;border:1px solid var(--line)}
.btn.primary{background:var(--pinta-2);color:#fff;border-color:var(--pinta-2)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--stop)}
.btn.small{padding:7px 10px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:90px}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.empty{color:var(--muted);padding:18px 4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{width:54px;font-size:16px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;text-align:right}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:480px){table{font-size:13px}td,th{padding:6px 2px}td input{width:48px;font-size:15px}}
td.num{text-align:right;font-weight:700}
.hl{background:#FBEFD9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi span{display:block;font-size:12px;color:var(--muted)} .kpi strong{font-size:26px}
.kpi.main{background:var(--pinta);color:#fff;border-color:var(--pinta)} .kpi.main span{color:#D9C8EA}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:14px}
.chip.ok{border-color:#9FD3B5;background:#E6F4EC} .chip.no{border-color:#EDB1AC;background:#FBEAE8}
.chip[aria-pressed="true"]{background:var(--pinta-2);color:#fff;border-color:var(--pinta-2)}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item .grow{flex:1;min-width:0}

details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:4px 12px}
summary{padding:8px 0;font-weight:600;cursor:pointer}
.small{font-size:13px;color:var(--muted)}
.ok-txt{color:var(--go)} .bad-txt{color:var(--stop)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}

.pill.sync{border:0;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#B9B2C4}
.pill.st-ok::before{background:#5FD38D} .pill.st-busy::before{background:#F2B84B} .pill.st-err{background:#B3261E} .pill.st-err::before{background:#fff} .pill.st-local::before{background:#9DB8F2}
.st-ok-txt{color:var(--go)} .st-busy-txt{color:var(--warn)} .st-err-txt{color:var(--stop)} .st-local-txt{color:var(--own)}
label.btn{cursor:pointer}
</style>
</head>
<body>
<header class="top"><div class="in" id="topbar"><b>AS Pinta</b><span class="pill">Carico i dati…</span></div></header>
<main class="wrap" id="app"><p class="empty">Carico listone e impostazioni…</p></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Serve JavaScript attivo.</p></noscript>
<script>

"use strict";
const APP_VERSION = "2.0";
const ROLES = ["Por","Dc","B","Dd","Ds","E","M","C","W","T","A","Pc"];
let P = [], SHORT = [], CFG = null, TEAMS = [], NOI = "", RIVALS = [], RULES = null, PRICE = null, MINS = null, byName = new Map(), dataFromCache = false;

/* ---------- testo e ricerca ---------- */
const norm = s => (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/['’`]/g,"").replace(/[^a-z0-9. ]+/g," ").replace(/\s+/g," ").trim();
function init(players, cfg, shortlist){
  P = players; SHORT = shortlist; CFG = cfg;
  TEAMS = cfg.squadre; NOI = cfg.noi; RIVALS = TEAMS.filter(t => t !== NOI);
  RULES = cfg.regole; PRICE = cfg.prezzi; MINS = cfg.minimiRuolo;
  byName = new Map(P.map(p => [p.n, p]));
  P.forEach(p => {
    const toks = p.n.split(/\s+/);
    p._n = norm(p.n).replace(/\./g,"");
    p._main = toks.filter(t => !t.endsWith(".")).map(t => norm(t)).filter(Boolean);
    p._init = toks.filter(t => t.endsWith(".")).flatMap(t => norm(t).split(".").filter(Boolean));
    p._t = norm(p.t);
  });
}
const esc = s => (s??"").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function searchPlayers(q){
  q = norm(q).replace(/\./g,""); if (q.length < 2) return [];
  const out = [];
  for (const p of P){
    let s = 0;
    if (p._n.startsWith(q)) s = 100;
    else if (p._main.some(t => t.startsWith(q))) s = 90;
    else if (p._n.includes(q)) s = 70;
    else if (p._t.startsWith(q)) s = 40;
    if (s) out.push([s, p]);
  }
  return out.sort((a,b) => b[0]-a[0] || b[1].sc-a[1].sc).slice(0, 25).map(x => x[1]);
}
function matchPlayer(text){
  const q = norm(text).replace(/\./g," ").replace(/\s+/g," ").trim(); if (!q) return {p:null};
  const qt = q.split(" ");
  const cands = [];
  for (const p of P){
    let s = 0;
    if (p._n === q.replace(/ /g," ")) s = 100;
    else if (p._main.length && p._main.every(t => qt.includes(t))) {
      s = 80;
      if (p._init.length && qt.some(t => !p._main.includes(t) && p._init.some(g => t.startsWith(g)))) s += 10;
      if (qt.length === p._main.length) s += 5;
    }
    if (s) cands.push([s, p]);
  }
  cands.sort((a,b) => b[0]-a[0]);
  if (!cands.length) return {p:null};
  if (cands.length > 1 && cands[0][0] - cands[1][0] < 5) return {p:null, amb: cands.slice(0,3).map(c => c[1].n)};
  return {p: cands[0][1]};
}
function matchTeam(text){
  const q = norm(text); if (q.length < 3) return null;
  for (const t of TEAMS) if (norm(t) === q) return t;
  for (const t of TEAMS){ const nt = norm(t); if (nt.includes(q) || q.includes(nt)) return t; }
  const words = q.split(" ").filter(w => w.length > 3);
  for (const t of TEAMS){ const nt = norm(t); if (words.some(w => nt.includes(w))) return t; }
  return null;
}

/* ---------- stato: dispositivo (localStorage) + GitHub (branch dedicato) ---------- */
const LS_STATE = "astaPinta.state.v2", LS_GH = "astaPinta.github.v1", LS_CACHE = "astaPinta.data.v1";
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let localOk = true;
function defaults(){
  const s = CFG.impostazioni;
  return {version:2, updatedAt:0, set:{...s}, mine:[], asg:{},
    riv:Object.fromEntries(RIVALS.map(t => [t, {c:s.budget, g:0, p:0}])),
    must:(CFG.must || []).filter(m => m && m.n).map(m => ({n:m.n, max:+m.max || 0, why:m.why || ""})),
    black:(CFG.evita || []).filter(Boolean), upd:"", log:[]};
}
let S = null;
const utf8b64 = str => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64utf8 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
const enc = o => utf8b64(JSON.stringify(o));
const dec = c => JSON.parse(b64utf8(c.trim()));
function merge(o){
  const d = defaults(); const s = Object.assign(d, o || {});
  s.set = Object.assign(defaults().set, (o && o.set) || {});
  s.riv = Object.assign(defaults().riv, (o && o.riv) || {});
  ["mine","must","black","log"].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.asg || typeof s.asg !== "object") s.asg = {};
  return s;
}
function loadLocal(){
  const raw = ls.get(LS_STATE);
  if (raw){ try { S = merge(JSON.parse(raw)); return; } catch(e){} }
  S = defaults();
}
function persist(){
  S.updatedAt = Date.now();
  localOk = ls.set(LS_STATE, JSON.stringify(S));
  if (gh.ok()) sync.schedule();
  updateStatus();
}
function logEvent(a, n, t, p){ S.log.push({ts: Date.now(), a, n: n || "", t: t || "", p: p ?? ""}); if (S.log.length > 1000) S.log.splice(0, S.log.length - 1000); }

const gh = {
  sha: null,
  cfg(){ try { const c = JSON.parse(ls.get(LS_GH) || "null"); return c ? Object.assign({branch: CFG.github.branch, file: CFG.github.file, repo: CFG.github.repo}, c) : null; } catch(e){ return null; } },
  ok(){ const c = this.cfg(); return !!(c && c.owner && c.repo && c.token); },
  base(){ const c = this.cfg(); return `https://api.github.com/repos/${encodeURIComponent(c.owner.trim())}/${encodeURIComponent(c.repo.trim())}`; },
  async req(method, path, body){
    const c = this.cfg();
    const headers = {"Authorization": "Bearer " + c.token.trim(), "Accept": "application/vnd.github+json"};
    if (body) headers["Content-Type"] = "application/json";
    const r = await fetch(this.base() + path, {method, headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store"});
    let j = null; try { j = await r.json(); } catch(e){}
    return {status: r.status, ok: r.ok, j};
  },
  explain(r){
    const m = r.j && r.j.message ? ` (${r.j.message})` : "";
    if (r.status === 401) return "Token non valido o scaduto" + m;
    if (r.status === 403) return "Il token non ha il permesso di scrittura: serve Contents 'Read and write'" + m;
    if (r.status === 404) return "Repository non trovato: controlla utente, nome del repo e che il token abbia accesso a quel repo" + m;
    return "Errore GitHub " + r.status + m;
  },
  async ensureBranch(){
    const c = this.cfg();
    const r = await this.req("GET", `/git/ref/heads/${encodeURIComponent(c.branch)}`);
    if (r.status === 200) return;
    const repo = await this.req("GET", "");
    if (!repo.ok) throw new Error(this.explain(repo));
    if (r.status !== 404) throw new Error(this.explain(r));
    const main = await this.req("GET", `/git/ref/heads/${encodeURIComponent(repo.j.default_branch)}`);
    if (!main.ok) throw new Error(this.explain(main));
    const cr = await this.req("POST", "/git/refs", {ref: `refs/heads/${c.branch}`, sha: main.j.object.sha});
    if (!cr.ok && cr.status !== 422) throw new Error(this.explain(cr));
  },
  async getState(){
    const c = this.cfg();
    const r = await this.req("GET", `/contents/${c.file}?ref=${encodeURIComponent(c.branch)}`);
    if (r.status === 404) { this.sha = null; return {missing: true}; }
    if (!r.ok) throw new Error(this.explain(r));
    this.sha = r.j.sha;
    return {state: JSON.parse(b64utf8(r.j.content))};
  },
  async putState(){
    const c = this.cfg();
    const body = {message: `Asta ${new Date().toLocaleString("it-IT")}: ${S.mine.length} nostri, ${Object.keys(S.asg).length} altri`, content: utf8b64(JSON.stringify(S, null, 1)), branch: c.branch};
    if (this.sha) body.sha = this.sha;
    let r = await this.req("PUT", `/contents/${c.file}`, body);
    if (r.status === 409 || r.status === 422 || (r.status === 404 && this.sha)){
      const g = await this.req("GET", `/contents/${c.file}?ref=${encodeURIComponent(c.branch)}`);
      if (g.ok) body.sha = g.j.sha; else delete body.sha;
      r = await this.req("PUT", `/contents/${c.file}`, body);
    }
    if (!r.ok) throw new Error(this.explain(r));
    this.sha = r.j.content.sha;
  }
};

const sync = {
  timer: null, busy: false, dirty: false, again: false, last: null, err: null,
  schedule(delay = 2500){ this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), delay); },
  async run(){
    if (!gh.ok() || !this.dirty) return;
    if (this.busy){ this.again = true; return; }
    this.busy = true; this.dirty = false; updateStatus();
    try { await gh.putState(); this.last = new Date(); this.err = null; }
    catch(e){ this.err = e.message || String(e); this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 15000); }
    this.busy = false;
    if (this.again){ this.again = false; this.dirty = true; this.busy = false; return this.run(); }
    updateStatus();
  }
};

async function connectAndPull(opts = {}){
  if (!gh.ok()) return;
  sync.busy = true; sync.err = null; updateStatus();
  try {
    await gh.ensureBranch();
    const r = await gh.getState();
    sync.busy = false;
    if (r.missing){ sync.dirty = true; await sync.run(); if (opts.verbose) toast("Collegato: stato creato su GitHub"); }
    else {
      const rem = merge(r.state);
      if (opts.force || (rem.updatedAt || 0) > (S.updatedAt || 0)){ S = rem; localOk = ls.set(LS_STATE, JSON.stringify(S)); sync.last = new Date(); render(); toast("Caricato lo stato da GitHub"); }
      else if ((rem.updatedAt || 0) < (S.updatedAt || 0)){ sync.dirty = true; await sync.run(); if (opts.verbose) toast("Collegato: GitHub aggiornato con i dati di questo dispositivo"); }
      else { sync.last = new Date(); if (opts.verbose) toast("Collegato: già tutto allineato"); }
    }
  } catch(e){ sync.busy = false; sync.err = e.message || String(e); if (opts.verbose) toast(sync.err); }
  updateStatus();
}

function statusInfo(){
  if (!gh.ok()) return localOk ? {cls:"st-local", txt:"Salvato sul dispositivo"} : {cls:"st-err", txt:"Non salvato!"};
  if (sync.err) return {cls:"st-err", txt:"GitHub: errore"};
  if (sync.busy || sync.dirty) return {cls:"st-busy", txt:"Salvo su GitHub"};
  if (sync.last) return {cls:"st-ok", txt:"GitHub " + sync.last.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"})};
  return {cls:"st-busy", txt:"GitHub"};
}
function updateStatus(){ const el = document.getElementById("syncpill"); if (!el) return; const s = statusInfo(); el.className = "pill sync " + s.cls; el.textContent = s.txt; }

/* ---------- calcoli ---------- */
const mult = fv => fv >= PRICE.sogliaBig ? PRICE.moltBig : (fv >= PRICE.sogliaMedi ? PRICE.moltMedi : PRICE.moltBassi);
const aggr = () => S.set.stile === "Prudente" ? 0.9 : (S.set.stile === "Aggressivo" ? 1.1 : 1);
const market = p => Math.max(1, Math.round(p.fv/1000 * S.set.budget * mult(p.fv)));
const baseMax = p => Math.min(Math.round(S.set.tetto/100 * S.set.budget), Math.max(1, Math.round(market(p) * p.f * aggr())));
const mustOf = n => S.must.find(m => m.n === n);
const maxFor = p => { const m = mustOf(p.n); return m ? (m.max > 0 ? m.max : Math.max(Math.round(market(p)*PRICE.extraMust), baseMax(p))) : baseMax(p); };
const consOf = p => mustOf(p.n) ? "MUST" : (S.black.includes(p.n) ? "EVITA (scelta nostra)" : p.c);
const mineOf = n => S.mine.find(x => x.n === n);
const isPor = n => { const p = byName.get(n); if (p) return p.tr === "Por"; const m = mineOf(n); return !!(m && m.por); };
const resOf = m => m.max > 0 ? m.max : (byName.get(m.n) ? Math.round(market(byName.get(m.n))*PRICE.extraMust) : 0);

function me(){
  const spent = S.mine.reduce((a,x) => a + (+x.p||0), 0);
  const por = S.mine.filter(x => isPor(x.n)).length, tot = S.mine.length, mov = tot - por;
  const rem = S.set.budget - spent, porMiss = Math.max(0, RULES.porMin-por), movMiss = Math.max(0, RULES.movMin-mov);
  const tecPor = (por >= RULES.porMax || tot >= RULES.rosaMax) ? 0 : Math.max(0, rem - (Math.max(0, porMiss-1) + movMiss));
  const tecMov = (mov >= RULES.movMax || tot >= RULES.rosaMax) ? 0 : Math.max(0, rem - (porMiss + Math.max(0, movMiss-1)));
  const mustRes = S.must.filter(m => !mineOf(m.n) && !S.asg[m.n]).reduce((a,m) => a + resOf(m), 0);
  const finRes = movMiss <= 3 ? 0 : Math.min(+S.set.riserva||0, Math.max(0, rem - (porMiss + movMiss)));
  return {spent, por, mov, tot, rem, porMiss, movMiss, tecPor, tecMov, mustRes, finRes,
    consPor: Math.max(0, tecPor - mustRes - finRes), consMov: Math.max(0, tecMov - mustRes - finRes)};
}
function rivMax(r, portiere){
  const mov = Math.max(0, r.g - r.p), porMiss = Math.max(0, RULES.porMin - r.p), movMiss = Math.max(0, RULES.movMin - mov);
  if (portiere) return (r.p >= RULES.porMax || r.g >= RULES.rosaMax) ? 0 : Math.max(0, r.c - (Math.max(0, porMiss-1) + movMiss));
  return (mov >= RULES.movMax || r.g >= RULES.rosaMax) ? 0 : Math.max(0, r.c - (porMiss + Math.max(0, movMiss-1)));
}
function topRival(portiere){ let best = {t:"-", v:0}; for (const t of RIVALS){ const v = rivMax(S.riv[t] || {c:S.set.budget,g:0,p:0}, portiere); if (v > best.v) best = {t, v}; } return best; }

function verdict(p){
  const own = mineOf(p.n), gone = S.asg[p.n];
  if (own) return {cls:"own", what:"Già nostro", price: own.p, lab:"pagato"};
  if (gone) return {cls:"gone", what:"Andato a " + (gone.t || "un'altra squadra"), price: gone.p || "", lab: gone.p ? "crediti" : ""};
  const m = me(), por = p.tr === "Por", mx = maxFor(p), cons = consOf(p), must = mustOf(p.n);
  let off = por ? m.consPor : m.consMov;
  if (must) off = Math.max(0, (por ? m.tecPor : m.tecMov) - m.finRes - (m.mustRes - resOf(must)));
  const lim = Math.min(mx, off), tr = topRival(por);
  let tip = tr.v === 0 ? "" : (tr.v < lim ? `Nessun rivale può superare ${tr.v}: basta offrire ${tr.v + 1}.` : `Il rivale più ricco (${tr.t}) può arrivare a ${tr.v}.`);
  if (mx > off && off > 0) tip += " Il limite è dato dai tuoi crediti, non dal valore.";
  if (!must && market(p) > mx * 1.3) tip += ` Mercato stimato ${market(p)}: probabilmente andrà oltre il tuo tetto.`;
  if (cons.startsWith("EVITA")) return {cls:"stop", what:"Lascia", price:"", lab:"", tip: cons === "EVITA (scelta nostra)" ? "È nella vostra lista da evitare." : "Sconsigliato (infortunio lungo o giocatore a rischio)."};
  if (off <= 0) return {cls:"stop", what:"Non puoi", price:"", lab:"", tip:"Crediti finiti o ruolo già pieno."};
  if (must) return {cls:"must", what:"MUST: prendilo", price: lim, lab:"fino a", tip};
  if (/^(TOP|OBIETTIVO|BUONO)/.test(cons)) return {cls:"go", what:"Prendi", price: lim, lab:"fino a", tip};
  if (cons.startsWith("OCCASIONE")) return {cls:"warn", what:"Occasione, solo a sconto", price: lim, lab:"fino a", tip};
  return {cls:"warn", what:"Solo se costa poco", price: lim, lab:"fino a", tip};
}

function parseImport(text){
  const out = {riv:[], asg:[], bad:[]};
  for (let line of text.split(/\r?\n/)){
    line = line.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "").replace(/\*\*/g,"").trim().replace(/^\|/, "").replace(/\|$/, "").trim();
    if (!line || /^\|?\s*:?-{2,}/.test(line)) continue;
    let parts = /[;|\t]/.test(line) ? line.split(/[;|\t]/) : line.split(",");
    parts = parts.map(s => s.trim());
    const nonEmpty = parts.filter(s => s !== "");
    if (!nonEmpty.length) continue;
    if (/^(squadra|giocatore|team|nome)$/i.test(norm(nonEmpty[0]))) continue;
    const nums = nonEmpty.map(s => /^\d+$/.test(s.replace(/\s/g,"")) ? +s.replace(/\s/g,"") : null);
    const team0 = matchTeam(nonEmpty[0]);
    if (team0 && nums[1] !== null && nums[1] !== undefined){
      const numsAfter = parts.slice(1).map(s => /^\d+$/.test(s.replace(/\s/g,"")) ? +s.replace(/\s/g,"") : null);
      out.riv.push({t: team0, c: numsAfter[0], g: numsAfter[1] ?? null, p: numsAfter[2] ?? null});
      continue;
    }
    let team = null, name = null, price = null;
    nonEmpty.forEach((s, i) => { if (nums[i] !== null) price = nums[i]; else if (!team && matchTeam(s) && !matchPlayer(s).p) team = matchTeam(s); else if (!name) name = s; });
    if (!name){ out.bad.push(line); continue; }
    const mp = matchPlayer(name);
    if (!mp.p){ out.bad.push(line + (mp.amb ? "  (ambiguo: " + mp.amb.join(", ") + ")" : "")); continue; }
    out.asg.push({n: mp.p.n, t: team, pr: price, raw: name});
  }
  return out;
}
function applyImport(ip){
  const scala = $("#scala") && $("#scala").checked;
  const now = new Date().toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});
  ip.riv.forEach(x => { if (x.t === NOI || !S.riv[x.t]) return; const r = S.riv[x.t]; if (x.c !== null && x.c !== undefined) r.c = x.c; if (x.g !== null) r.g = x.g; if (x.p !== null) r.p = x.p; });
  if (ip.riv.length){ S.upd = now; logEvent("crediti rivali (foto)", "", "", ip.riv.length + " squadre"); }
  let n = 0;
  ip.asg.forEach(x => {
    if (mineOf(x.n) || S.asg[x.n]) return;
    if (x.t === NOI){ S.mine.push({n: x.n, p: x.pr || 0}); logEvent("noi (foto)", x.n, NOI, x.pr); n++; return; }
    const a = {t: x.t || "", p: x.pr || ""};
    if (scala && x.t && x.pr){ const r = S.riv[x.t]; r.c -= x.pr; r.g += 1; if (isPor(x.n)) r.p += 1; a.s = 1; }
    S.asg[x.n] = a; logEvent("altri (foto)", x.n, x.t, x.pr); n++;
  });
  importPreview = null;
  commit(`Aggiornato: ${ip.riv.length} squadre, ${n} giocatori`);
}

    : `<p class="empty">Nessun MUST. Aprili da Cerca e tocca "Aggiungi ai MUST".</p>`;
  h += `<div class="row"><button class="btn small" data-seedcfg>Importa MUST e da evitare da config.json</button></div>`;
  if (S.black.length) h += `<h3>Da evitare</h3><div class="chips">${S.black.map((n,i) => `<button class="chip" data-blackdel="${i}">${esc(n)} ✕</button>`).join("")}</div>`;
  h += `<h3>Migliori ancora liberi per ruolo</h3><div class="chips">${ROLES.map(r => `<button class="chip" data-role="${r}" aria-pressed="${r === roleSel}">${r}</button>`).join("")}</div>
    <ul class="results">${free.map(p => `<li><button data-open="${esc(p.n)}"><span class="grow"><span class="nm">${esc(p.n)}</span><br><span class="meta">${esc(p.t)}, ${esc(p.r)}, ${esc(p.s)}</span></span>${miniTag(p)}</button></li>`).join("")}</ul>`;
  h += `<h3>Shortlist Piano A / B / C</h3>`;
  const groups = {}; SHORT.forEach(([rep, piano, n]) => (groups[rep] = groups[rep] || []).push([piano, n]));
  for (const [rep, items] of Object.entries(groups)){
    h += `<details><summary>${esc(rep)}</summary>` + items.map(([piano, n]) => { const p = byName.get(n); const done = mineOf(n) || S.asg[n];
      return `<div class="list-item"><span class="small" style="width:118px">${esc(piano)}</span><span class="grow"><button data-open="${esc(n)}" style="border:0;background:none;padding:0;font-weight:600" class="${done ? "strike" : ""}">${esc(n)}</button><br><span class="small">${p ? esc(p.t) : ""}</span></span>${p ? miniTag(p) : ""}</div>`; }).join("") + `</details>`;
  }
  return h;
}

function viewImpostazioni(){
  const s = S.set, c = gh.cfg() || {repo: CFG.github.repo, branch: CFG.github.branch, owner: "", token: ""}, st = statusInfo();
  return `<h2>Impostazioni</h2><div class="card"><div class="row">
    <label class="field">Budget<input type="number" inputmode="numeric" value="${s.budget}" data-set="budget"></label>
    <label class="field">Tetto per giocatore (%)<input type="number" inputmode="numeric" value="${s.tetto}" data-set="tetto"></label>
    <label class="field">Riserva per il finale<input type="number" inputmode="numeric" value="${s.riserva}" data-set="riserva"></label>
    <label class="field">Stile d'asta<select data-set="stile">${["Prudente","Normale","Aggressivo"].map(x => `<option ${x === s.stile ? "selected" : ""}>${x}</option>`).join("")}</select></label></div>
    <p class="small">Tetto 25% = nessun giocatore oltre 125 crediti (i MUST fanno eccezione). Per puntare su Malen o Lautaro serve circa 45%. Prudente abbassa i tetti del 10%, Aggressivo li alza del 10%.</p></div>

    <h3>Salvataggio su GitHub</h3>
    <div class="card">
      <p class="small">Stato attuale: <b class="${st.cls}-txt">${esc(st.txt)}</b>${sync.err ? `<br><span class="bad-txt">${esc(sync.err)}</span>` : ""}</p>
      <p class="small">Ogni modifica è salvata subito su questo dispositivo. Se colleghi GitHub, qualche secondo dopo viene salvata anche nel repo (branch <b>${esc(c.branch)}</b>, file <b>${esc(c.file || CFG.github.file)}</b>): se chiudi Safari, cambi dispositivo o si cancella la memoria, riparti da lì. Il token resta solo su questo dispositivo.</p>
      <div class="row">
        <label class="field">Utente GitHub<input id="gh_owner" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(c.owner || "")}" placeholder="il tuo username"></label>
        <label class="field">Repository<input id="gh_repo" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(c.repo || "")}"></label>
        <label class="field">Branch dello stato<input id="gh_branch" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(c.branch || "")}"></label>
      </div>
      <label class="field" style="margin-top:8px">Token (fine-grained, solo questo repo, Contents: Read and write)<input id="gh_token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(c.token || "")}" placeholder="github_pat_..."></label>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" data-ghconnect>Collega e sincronizza</button>
        <button class="btn" data-ghpush ${gh.ok() ? "" : "disabled"}>Salva ora su GitHub</button>
        <button class="btn" data-ghpull ${gh.ok() ? "" : "disabled"}>Ricarica da GitHub</button>
        <button class="btn danger" data-ghoff ${gh.ok() ? "" : "disabled"}>Scollega</button>
      </div>
      <p class="small">"Ricarica da GitHub" sostituisce i dati di questo dispositivo con quelli salvati nel repo: usalo se passi da un dispositivo all'altro.</p>
    </div>

    <h3>Backup manuale</h3><div class="card">
    <div class="row"><button class="btn dark" data-download>Scarica file di backup</button><button class="btn" data-backup>Copia codice di backup</button></div>
    <textarea id="restore" placeholder="Incolla qui un codice di backup" style="min-height:80px;margin-top:10px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" data-restore>Ripristina dal codice</button>
      <label class="btn">Ripristina da file<input type="file" id="restorefile" accept="application/json,.json" style="display:none"></label>
      <button class="btn danger" data-reset>${resetArm ? "Tocca ancora per azzerare tutto" : "Azzera tutto"}</button></div></div>
    <p class="small">Versione ${APP_VERSION}. Dati ${dataFromCache ? "caricati dalla copia salvata (offline)" : "caricati dal repo"}: SOS Fanta e fantacalcio.it al 10/09/2026, Juve e Lazio esclusi, prezzi tarati su ${TEAMS.length} squadre da ${CFG.impostazioni.budget} crediti.</p>`;
}

async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast("Copiato"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(_) {} ta.remove(); toast(ok ? "Copiato" : "Copia non riuscita: seleziona il testo a mano"); }
}

/* ---------- eventi ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.tab){ tab = d.tab; if (tab !== "cerca") selected = null; resetArm = false; render(); window.scrollTo(0,0); if (tab === "cerca") setTimeout(() => $("#q") && $("#q").focus(), 30); return; }
  if (d.open){ selected = d.open; tab = "cerca"; render(); window.scrollTo(0,0); return; }
  if ("back" in d){ selected = null; query = ""; render(); setTimeout(() => $("#q").focus(), 30); return; }
  if (d.buy){ const pr = parseInt($("#price").value, 10); if (!(pr > 0)){ toast("Scrivi il prezzo pagato"); $("#price").focus(); return; } S.mine.push({n: d.buy, p: pr}); logEvent("noi", d.buy, NOI, pr); selected = null; query = ""; commit(`${d.buy} preso a ${pr}`); return; }
  if (d.other){ const t = $("#team").value, pr = parseInt($("#price").value, 10); const a = {t, p: pr > 0 ? pr : ""};
    if (t && pr > 0){ const r = S.riv[t]; r.c -= pr; r.g += 1; if (isPor(d.other)) r.p += 1; a.s = 1; }
    S.asg[d.other] = a; logEvent("altri", d.other, t, pr > 0 ? pr : ""); selected = null; query = ""; commit(`${d.other} segnato come preso${t ? " da " + t : ""}`); return; }
  if (d.undo){ const n = d.undo; const i = S.mine.findIndex(x => x.n === n); if (i >= 0) S.mine.splice(i, 1);
    const a = S.asg[n]; if (a){ if (a.s && a.t && a.p){ const r = S.riv[a.t]; r.c += +a.p; r.g -= 1; if (isPor(n)) r.p -= 1; } delete S.asg[n]; }
    logEvent("annulla", n); commit("Assegnazione annullata"); return; }
  if (d.must){ const i = S.must.findIndex(m => m.n === d.must); if (i >= 0) S.must.splice(i, 1); else { S.must.push({n: d.must, max: 0}); S.black = S.black.filter(x => x !== d.must); } commit(i >= 0 ? "Tolto dai MUST" : "Aggiunto ai MUST: imposta il prezzo in Obiettivi"); return; }
  if (d.black){ const i = S.black.indexOf(d.black); if (i >= 0) S.black.splice(i, 1); else { S.black.push(d.black); S.must = S.must.filter(m => m.n !== d.black); } commit(i >= 0 ? "Tolto da evitare" : "Messo tra da evitare"); return; }
  if (d.del){ S.mine.splice(+d.del, 1); commit("Tolto dalla rosa"); return; }
  if ("addx" in d){ const n = $("#xname").value.trim(), pr = parseInt($("#xprice").value, 10); if (!n || !(pr >= 0)){ toast("Scrivi nome e prezzo"); return; } S.mine.push({n, p: pr, por: $("#xpor").value === "1"}); commit(`${n} aggiunto`); return; }
  if (d.mustdel){ S.must.splice(+d.mustdel, 1); commit("Tolto dai MUST"); return; }
  if (d.blackdel){ S.black.splice(+d.blackdel, 1); commit("Tolto da evitare"); return; }
  if (d.role){ roleSel = d.role; render(); return; }
  if (d.copy){ copyText(d.copy === "squadre" ? PROMPT_SQUADRE() : PROMPT_GIOCATORI()); return; }
  if ("parse" in d){ const t = $("#paste").value; importPreview = parseImport(t); render(); const ta = $("#paste"); if (ta) ta.value = t; return; }
  if ("apply" in d){ if (importPreview) applyImport(importPreview); return; }
  if ("cancelimport" in d){ importPreview = null; render(); return; }
  if ("backup" in d){ copyText(enc(S)); return; }
  if ("restore" in d){ try { S = merge(dec($("#restore").value)); commit("Ripristinato dal backup"); } catch(err){ toast("Codice non valido: copialo di nuovo per intero"); } return; }
  if ("ghconnect" in d){
    const owner = $("#gh_owner").value.trim(), repo = $("#gh_repo").value.trim(), branch = $("#gh_branch").value.trim() || CFG.github.branch, token = $("#gh_token").value.trim();
    if (!owner || !repo || !token){ toast("Servono utente, repository e token"); return; }
    ls.set(LS_GH, JSON.stringify({owner, repo, branch, token, file: CFG.github.file}));
    toast("Collegamento in corso"); connectAndPull({verbose: true}).then(render); return; }
  if ("ghpush" in d){ sync.dirty = true; sync.run().then(() => { render(); toast(sync.err ? sync.err : "Salvato su GitHub"); }); return; }
  if ("ghpull" in d){ connectAndPull({verbose: true, force: true}).then(render); return; }
  if ("ghoff" in d){ ls.del(LS_GH); sync.err = null; sync.last = null; render(); toast("GitHub scollegato da questo dispositivo"); return; }
  if ("download" in d){
    const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `asta-as-pinta-${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); return; }
  if ("seedcfg" in d){
    let n = 0;
    (CFG.must || []).filter(m => m && m.n).forEach(m => { const cur = mustOf(m.n); if (cur){ if (+m.max > 0) cur.max = +m.max; } else { S.must.push({n: m.n, max: +m.max || 0, why: m.why || ""}); n++; } S.black = S.black.filter(x => x !== m.n); });
    (CFG.evita || []).filter(Boolean).forEach(x => { if (!S.black.includes(x)){ S.black.push(x); S.must = S.must.filter(m => m.n !== x); n++; } });
    const unknown = [...(CFG.must || []).filter(m => m && m.n).map(m => m.n), ...(CFG.evita || [])].filter(x => !byName.has(x));
    commit(`Importati ${n} nomi da config.json` + (unknown.length ? `. Non nel listone: ${unknown.join(", ")}` : "")); return; }
  if ("reset" in d){ if (!resetArm){ resetArm = true; render(); return; } S = defaults(); resetArm = false; selected = null; query = ""; commit("Tutto azzerato"); return; }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q"){ query = el.value; selected = null; $("#res").innerHTML = resultsHTML(); }
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (d.riv){ const v = parseInt(el.value, 10); S.riv[d.riv] = S.riv[d.riv] || {c:S.set.budget,g:0,p:0}; S.riv[d.riv][d.k] = isNaN(v) ? 0 : v; S.upd = new Date().toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"}); commit(); }
  if (d.editprice !== undefined){ const v = parseInt(el.value, 10); S.mine[+d.editprice].p = isNaN(v) ? 0 : v; commit("Prezzo aggiornato"); }
  if (d.mustmax !== undefined){ const v = parseInt(el.value, 10); S.must[+d.mustmax].max = isNaN(v) ? 0 : v; commit("Prezzo MUST aggiornato"); }
  if (d.set){ S.set[d.set] = d.set === "stile" ? el.value : (parseFloat(el.value) || 0); commit("Impostazione salvata"); }
  if (el.id === "restorefile" && el.files && el.files[0]){
    el.files[0].text().then(t => { try { S = merge(JSON.parse(t)); commit("Ripristinato dal file"); } catch(err){ toast("File non valido"); } }); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "q"){ const r = searchPlayers(query); if (r.length){ selected = r[0].n; render(); } }
});

function fatal(msg){
  document.getElementById("app").innerHTML = `<div class="card" style="margin-top:20px"><h2 style="margin-top:0">L'app non riesce a partire</h2><p>${esc(msg)}</p><p class="small">Aprila dal link di GitHub Pages (non come file sul dispositivo) e controlla che nel repo ci sia la cartella <b>data</b> con players.json, config.json e shortlist.json.</p></div>`;
}
async function fetchJSON(path){ const r = await fetch(`${path}?v=${Date.now()}`, {cache: "no-store"}); if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.json(); }
async function boot(){
  try {
    const [players, cfg, shortlist] = await Promise.all([fetchJSON("data/players.json"), fetchJSON("data/config.json"), fetchJSON("data/shortlist.json")]);
    init(players, cfg, shortlist);
    ls.set(LS_CACHE, JSON.stringify({players, cfg, shortlist, at: Date.now()}));
  } catch(e){
    const cached = ls.get(LS_CACHE);
    if (!cached){ fatal("Non riesco a leggere i file dati (" + (e.message || e) + ")."); return; }
    try { const o = JSON.parse(cached); init(o.players, o.cfg, o.shortlist); dataFromCache = true; } catch(err){ fatal("Copia dei dati danneggiata."); return; }
  }
  loadLocal();
  if (!ls.set("astaPinta.test", "1")) localOk = false;
  render();
  if (dataFromCache) toast("Offline: uso la copia dei dati salvata");
  if (gh.ok()) connectAndPull();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && sync.dirty && gh.ok()){ clearTimeout(sync.timer); sync.run(); } });
window.addEventListener("online", () => { if (sync.dirty && gh.ok()) sync.run(); });
boot();

</script>
</body>
