<!DOCTYPE html>
<html lang="it" data-channel="beta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E1D5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asta Pinta">
<meta name="robots" content="noindex">
<title>Asta AS Pinta BETA</title>
<style>
:root{
  --bg:#ECEEF2; --card:#FFFFFF; --ink:#1A1F2B; --muted:#646C7D; --line:#D6DAE3;
  --pinta:#3E1D5C; --pinta-2:#7B3FB0; --go:#15784A; --warn:#A66A00; --stop:#A8261D; --own:#2458B8; --gone:#7A8190;
  --r-lg:18px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--pinta);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 10px}
header.top .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top b{font-size:17px;margin-right:auto;letter-spacing:.2px}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.pill strong{font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:140px;border:0;background:none;padding:10px 2px 9px;font-size:12px;color:var(--muted)}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--pinta-2);font-weight:600}
h2{font-size:21px;margin:18px 0 10px}
h3{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border-radius:var(--r-lg);padding:14px;margin:10px 0;border:1px solid var(--line)}
.search{padding:12px 0 6px}
.search input{width:100%;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--pinta-2);background:#fff;outline:none}
.results{margin:4px 0 0;padding:0;list-style:none}
.results li button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:6px 0}
.results .nm{font-weight:600}
.results .meta{color:var(--muted);font-size:13px}
.results .tag{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.go{--c:var(--go)} .warn{--c:var(--warn)} .stop{--c:var(--stop)} .must{--c:var(--pinta-2)} .own{--c:var(--own)} .gone{--c:var(--gone)}
.dot{background:var(--c)} .tag{color:var(--c)}
.verdict{background:var(--c);color:#fff;border-radius:var(--r-lg);padding:16px 18px;margin:12px 0 8px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px}
.verdict .who{font-size:15px;opacity:.9;grid-column:1/-1}
.verdict .what{font-size:26px;font-weight:700;line-height:1.1}
.verdict .price{font-size:64px;font-weight:800;line-height:.9;text-align:right}
.verdict .price small{display:block;font-size:13px;font-weight:600;opacity:.85;text-align:right}
.verdict .tip{grid-column:1/-1;font-size:14px;background:rgba(255,255,255,.16);border-radius:10px;padding:7px 10px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:6px 0}@media (min-width:700px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts div{border-bottom:1px solid var(--line);padding:5px 0}
.facts dt{font-size:12px;color:var(--muted)} .facts dd{margin:0;font-weight:600}
.note{color:#333;font-size:15px;margin:10px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;background:#fff;border:1px solid var(--line)}
.btn.primary{background:var(--pinta-2);color:#fff;border-color:var(--pinta-2)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--stop)}
.btn.small{padding:7px 10px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:90px}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.empty{color:var(--muted);padding:18px 4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{width:54px;font-size:16px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;text-align:right}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:480px){table{font-size:13px}td,th{padding:6px 2px}td input{width:48px;font-size:15px}}
td.num{text-align:right;font-weight:700}
.hl{background:#FBEFD9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi span{display:block;font-size:12px;color:var(--muted)} .kpi strong{font-size:26px}
.kpi.main{background:var(--pinta);color:#fff;border-color:var(--pinta)} .kpi.main span{color:#D9C8EA}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:14px}
.chip.ok{border-color:#9FD3B5;background:#E6F4EC} .chip.no{border-color:#EDB1AC;background:#FBEAE8}
.chip[aria-pressed="true"]{background:var(--pinta-2);color:#fff;border-color:var(--pinta-2)}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item .grow{flex:1;min-width:0}
.strike{text-decoration:line-through;color:var(--gone)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:4px 12px}
summary{padding:8px 0;font-weight:600;cursor:pointer}
.small{font-size:13px;color:var(--muted)}
.ok-txt{color:var(--go)} .bad-txt{color:var(--stop)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}

.pill.sync{border:0;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#B9B2C4}
.pill.st-ok::before{background:#5FD38D} .pill.st-busy::before{background:#F2B84B} .pill.st-err{background:#B3261E} .pill.st-err::before{background:#fff} .pill.st-local::before{background:#9DB8F2}
.st-ok-txt{color:var(--go)} .st-busy-txt{color:var(--warn)} .st-err-txt{color:var(--stop)} .st-local-txt{color:var(--own)}
label.btn{cursor:pointer}

/* ---------- v2.1: layout denso, iPad affiancato, modalità asta ---------- */
.wrap{max-width:1180px;padding-left:12px;padding-right:12px}
header.top .in{max-width:1180px}
.card{padding:12px;margin:8px 0}
.search{display:flex;gap:8px;align-items:center;padding-top:10px}
.search input{flex:1;min-width:0;padding:12px 14px}
.search-tools{display:flex;gap:6px;flex:none}
.search-tools .btn{padding:10px 11px}
.search-stage.has-detail .listpane{display:none}
.detailpane{min-width:0}
.alt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px}

.alt-card b{display:block}.alt-card .small{display:block;margin-top:2px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff}
.badge.warn{border-color:#E7C07A;background:#FFF8EA;color:#7A5200}.badge.stop{border-color:#EDB1AC;background:#FBEAE8;color:var(--stop)}
.auction-note{font-size:12px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:7px}
.risk-card{border-left:5px solid var(--stop)}
.close-now .list-item{padding:7px 0}
.budget-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}
.budget-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px}.budget-item strong{font-size:20px}
body.auction nav.tabs{display:none}
body.auction .wrap{padding-bottom:18px}
body.auction header.top{position:static;padding-top:8px}
body.auction header.top .pill:not(.sync){display:none}
body.auction .search{position:sticky;top:0;z-index:25;background:var(--bg);padding:8px 0}
body.auction .verdict{padding:20px;margin-top:6px}
body.auction .verdict .what{font-size:34px}
body.auction .verdict .price{font-size:88px}
body.auction .auction-actions .btn{font-size:19px;padding:16px 18px;min-height:58px;flex:1}
body.auction .auction-actions .field{flex:0 0 95px}
body.auction .auction-actions input,body.auction .auction-actions select{font-size:20px}
@media (min-width:760px) and (orientation:landscape){
  .search-stage.has-detail{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(450px,1.28fr);gap:12px;align-items:start}
  .search-stage.has-detail .listpane{display:block;position:sticky;top:74px;max-height:calc(100vh - 110px);overflow:auto;padding-right:2px}
  .search-stage.has-detail .detailpane{display:block}
  .search-stage.has-detail .results li button{padding:8px 10px;margin:4px 0}
  .search-stage.has-detail .verdict{margin-top:4px}
}
@media (max-width:560px){
  .wrap{padding-left:9px;padding-right:9px}.card{padding:10px}.verdict{padding:13px 14px}.verdict .what{font-size:23px}.verdict .price{font-size:54px}
  .search-tools .mode-label{display:none}.facts{gap:4px 10px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.kpi strong{font-size:22px}
  nav.tabs button{font-size:11px;padding-left:0;padding-right:0}
}

/* ---------- v2.2 beta: premium visual refresh ---------- */
:root{
  --surface:#F8F8FB; --surface-2:#F1F0F6; --elev:0 10px 30px rgba(29,20,45,.075);
  --elev-soft:0 4px 14px rgba(29,20,45,.055); --glass:rgba(255,255,255,.78);
}
html,body{background:linear-gradient(180deg,#F6F4F9 0,#ECEEF2 36%,#ECEEF2 100%)}
body{letter-spacing:-.006em}
header.top{background:linear-gradient(120deg,#2B123E 0%,#4F216E 55%,#70409A 100%);box-shadow:0 8px 28px rgba(45,20,64,.18);border-bottom:1px solid rgba(255,255,255,.12)}

.pill{border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card,details,.kpi,.budget-item,.alt-card{box-shadow:var(--elev-soft)}
.card{border-color:rgba(80,67,101,.13);background:rgba(255,255,255,.94)}
h2{font-size:24px;letter-spacing:-.03em;margin-top:16px}
h3{letter-spacing:-.015em}
.search input{box-shadow:0 8px 26px rgba(78,37,108,.11);border-color:#6D37A0;background:rgba(255,255,255,.97)}

.results li button{border-color:rgba(80,67,101,.12);box-shadow:0 3px 11px rgba(29,20,45,.045);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}

.verdict .price{letter-spacing:-.06em}
.btn{box-shadow:0 3px 10px rgba(29,20,45,.045);transition:transform .12s ease,box-shadow .12s ease}
.btn.primary{background:linear-gradient(135deg,#6B32A0,#8A4FC0);box-shadow:0 7px 18px rgba(104,50,155,.20)}
.btn.dark{background:linear-gradient(135deg,#202331,#33384A)}
.kpi{background:linear-gradient(180deg,#fff,#FBFAFD);border-color:rgba(80,67,101,.12)}
.kpi.main{background:linear-gradient(145deg,#35164D,#65308E 72%,#7A45A8);box-shadow:0 10px 24px rgba(62,29,92,.18)}
.kpi strong{letter-spacing:-.04em}
nav.tabs{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:rgba(80,67,101,.10);box-shadow:0 -8px 30px rgba(29,20,45,.07)}
nav.tabs button{transition:color .15s ease,background .15s ease;border-radius:14px;margin:5px 2px;padding-top:7px;padding-bottom:7px}
nav.tabs button[aria-current="page"]{background:#F0E8F7;color:#6D37A0}
.team-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:750;line-height:1.1;border:1px solid var(--tb-border);background:linear-gradient(100deg,var(--tb-bg1),var(--tb-bg2));color:var(--tb-fg);white-space:nowrap;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4)}

<body>
<header class="top"><div class="in" id="topbar"><b>AS Pinta</b><span class="pill">Carico i dati…</span></div></header>
<main class="wrap" id="app"><p class="empty">Carico listone e impostazioni…</p></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Serve JavaScript attivo.</p></noscript>
<script>

"use strict";
const APP_VERSION = "2.2-beta";
const ROLES = ["Por","Dc","B","Dd","Ds","E","M","C","W","T","A","Pc"];
let P = [], SHORT = [], CFG = null, TEAMS = [], NOI = "", RIVALS = [], RULES = null, PRICE = null, MINS = null, byName = new Map(), dataFromCache = false;
let DATA_WARNINGS = [];

/* ---------- testo e ricerca ---------- */
const norm = s => (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/['’`]/g,"").replace(/[^a-z0-9. ]+/g," ").replace(/\s+/g," ").trim();
function init(players, cfg, shortlist){
  P = players; SHORT = shortlist; CFG = cfg;
  TEAMS = cfg.squadre; NOI = cfg.noi; RIVALS = TEAMS.filter(t => t !== NOI);
  RULES = cfg.regole; PRICE = cfg.prezzi; MINS = cfg.minimiRuolo;
  byName = new Map(P.map(p => [p.n, p]));
  P.forEach(p => {
    const toks = p.n.split(/\s+/);
    p._n = norm(p.n).replace(/\./g,"");
    p._main = toks.filter(t => !t.endsWith(".")).map(t => norm(t)).filter(Boolean);
    p._init = toks.filter(t => t.endsWith(".")).flatMap(t => norm(t).split(".").filter(Boolean));
    p._t = norm(p.t);
  });
}
const esc = s => (s??"").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CLUB_COLORS = {
  "Atalanta":["#E8F2FF","#EDEEF2","#164B91","#0B2F5C"], "Bologna":["#FCEBED","#EAF0FA","#A51D31","#233C77"],
  "Cagliari":["#FCEBED","#EAF0FA","#A72236","#263B76"], "Como":["#E7F1FF","#F3F8FF","#1565B5","#144A7A"],
  "Fiorentina":["#F2EAFB","#FAF7FD","#6B2C91","#4A1D69"], "Frosinone":["#FFF7D8","#EBF2FF","#D5A800","#244A88"],
  "Genoa":["#FCEBED","#E9EEF7","#A32236","#213B70"], "Inter":["#E8F1FF","#EEF0F4","#1769C2","#101926"],
  "Juventus":["#F6F6F7","#E9EAED","#15171B","#15171B"], "Lazio":["#E8F6FF","#F7FCFF","#6CBCEB","#245D7A"],
  "Lecce":["#FFF5D8","#FDE9E8","#C69B00","#A62B2A"], "Milan":["#FCE9EA","#ECEDEF","#C82432","#171A1F"],
  "Monza":["#FDEBED","#FFF8F8","#D32236","#9C1B29"], "Napoli":["#E7F6FF","#F8FCFF","#2A9ED5","#186D97"],
  "Parma":["#FFF4C7","#E9F0FF","#D8B100","#244F91"], "Roma":["#F8E7E3","#FFF2D6","#8B2231","#D2A51A"],
  "Sassuolo":["#E7F6EC","#ECEFF0","#19884B","#17201B"], "Torino":["#F6E8E8","#FBF6F6","#7A2635","#5A1D28"],
  "Udinese":["#F5F5F6","#EDEEEF","#22252B","#111318"], "Venezia":["#FFF0E7","#E8F3EA","#E96D1F","#1B6B42"]
};
function clubBadge(t){
  const c=CLUB_COLORS[t]||["#F1EEF5","#FAF9FC","#6A5C77","#51465D"];
  return `<span class="team-badge" style="--tb-bg1:${c[0]};--tb-bg2:${c[1]};--tb-accent:${c[2]};--tb-fg:${c[3]};--tb-border:${c[2]}33"><span class="club-dot"></span>${esc(t||"n.d.")}</span>`;
}

function searchPlayers(q){
  q = norm(q).replace(/\./g,""); if (q.length < 2) return [];
  const out = [];
  for (const p of P){
    let s = 0;
    if (p._n.startsWith(q)) s = 100;
    else if (p._main.some(t => t.startsWith(q))) s = 90;
    else if (p._n.includes(q)) s = 70;
    else if (p._t.startsWith(q)) s = 40;
    if (s) out.push([s, p]);
  }
  return out.sort((a,b) => b[0]-a[0] || b[1].sc-a[1].sc).slice(0, 25).map(x => x[1]);
}
function matchPlayer(text){
  const q = norm(text).replace(/\./g," ").replace(/\s+/g," ").trim(); if (!q) return {p:null};
  const qt = q.split(" ");
  const cands = [];
  for (const p of P){
    let s = 0;
    if (p._n === q.replace(/ /g," ")) s = 100;
    else if (p._main.length && p._main.every(t => qt.includes(t))) {
      s = 80;
      if (p._init.length && qt.some(t => !p._main.includes(t) && p._init.some(g => t.startsWith(g)))) s += 10;
      if (qt.length === p._main.length) s += 5;
    }
    if (s) cands.push([s, p]);
  }
  cands.sort((a,b) => b[0]-a[0]);
  if (!cands.length) return {p:null};
  if (cands.length > 1 && cands[0][0] - cands[1][0] < 5) return {p:null, amb: cands.slice(0,3).map(c => c[1].n)};
  return {p: cands[0][1]};
}
function matchTeam(text){
  const q = norm(text); if (q.length < 3) return null;
  for (const t of TEAMS) if (norm(t) === q) return t;
  for (const t of TEAMS){ const nt = norm(t); if (nt.includes(q) || q.includes(nt)) return t; }
  const words = q.split(" ").filter(w => w.length > 3);
  for (const t of TEAMS){ const nt = norm(t); if (words.some(w => nt.includes(w))) return t; }
  return null;
}

function defaults(){

let S = null;
const utf8b64 = str => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64utf8 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
const enc = o => utf8b64(JSON.stringify(o));
const dec = c => JSON.parse(b64utf8(c.trim()));

const gh = {
  sha: null,
  cfg(){ try { const c = JSON.parse(ls.get(LS_GH) || "null"); return c ? Object.assign({branch: stateBranch(), file: CFG.github.file, repo: CFG.github.repo}, c) : null; } catch(e){ return null; } },
  ok(){ const c = this.cfg(); return !!(c && c.owner && c.repo && c.token); },
  base(){ const c = this.cfg(); return `https://api.github.com/repos/${encodeURIComponent(c.owner.trim())}/${encodeURIComponent(c.repo.trim())}`; },
  async req(method, path, body){
    const c = this.cfg();
    const headers = {"Authorization": "Bearer " + c.token.trim(), "Accept": "application/vnd.github+json"};
    if (body) headers["Content-Type"] = "application/json";
    const r = await fetch(this.base() + path, {method, headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store"});
    let j = null; try { j = await r.json(); } catch(e){}
    return {status: r.status, ok: r.ok, j};
  },
  explain(r){
    const m = r.j && r.j.message ? ` (${r.j.message})` : "";
    if (r.status === 401) return "Token non valido o scaduto" + m;
    if (r.status === 403) return "Il token non ha il permesso di scrittura: serve Contents 'Read and write'" + m;
    if (r.status === 404) return "Repository non trovato: controlla utente, nome del repo e che il token abbia accesso a quel repo" + m;
    return "Errore GitHub " + r.status + m;
  },
  async ensureBranch(){
    const c = this.cfg();
    const r = await this.req("GET", `/git/ref/heads/${encodeURIComponent(c.branch)}`);
    if (r.status === 200) return;
    const repo = await this.req("GET", "");
    if (!repo.ok) throw new Error(this.explain(repo));
    if (r.status !== 404) throw new Error(this.explain(r));
    const main = await this.req("GET", `/git/ref/heads/${encodeURIComponent(repo.j.default_branch)}`);
    if (!main.ok) throw new Error(this.explain(main));
    const cr = await this.req("POST", "/git/refs", {ref: `refs/heads/${c.branch}`, sha: main.j.object.sha});
    if (!cr.ok && cr.status !== 422) throw new Error(this.explain(cr));
  },
  async getState(){
    const c = this.cfg();
    const r = await this.req("GET", `/contents/${c.file}?ref=${encodeURIComponent(c.branch)}`);
    if (r.status === 404) { this.sha = null; return {missing: true}; }
    if (!r.ok) throw new Error(this.explain(r));
    this.sha = r.j.sha;
    return {state: JSON.parse(b64utf8(r.j.content))};
  },
  async putState(){
    const c = this.cfg();
    const body = {message: `Asta ${new Date().toLocaleString("it-IT")}: ${S.mine.length} nostri, ${Object.keys(S.asg).length} altri`, content: utf8b64(JSON.stringify(S, null, 1)), branch: c.branch};
    if (this.sha) body.sha = this.sha;
    let r = await this.req("PUT", `/contents/${c.file}`, body);
    if (r.status === 409 || r.status === 422 || (r.status === 404 && this.sha)){
      const g = await this.req("GET", `/contents/${c.file}?ref=${encodeURIComponent(c.branch)}`);
      if (g.ok) body.sha = g.j.sha; else delete body.sha;
      r = await this.req("PUT", `/contents/${c.file}`, body);
    }
    if (!r.ok) throw new Error(this.explain(r));
    this.sha = r.j.content.sha;
  }
};

const sync = {
  timer: null, busy: false, dirty: false, again: false, last: null, err: null,
  schedule(delay = 2500){ this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), delay); },
  async run(){
    if (!gh.ok() || !this.dirty) return;
    if (this.busy){ this.again = true; return; }
    this.busy = true; this.dirty = false; updateStatus();
    try { await gh.putState(); this.last = new Date(); this.err = null; }
    catch(e){ this.err = e.message || String(e); this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 15000); }
    this.busy = false;
    if (this.again){ this.again = false; this.dirty = true; this.busy = false; return this.run(); }
    updateStatus();
  }
};

async function connectAndPull(opts = {}){
  if (!gh.ok()) return;
  sync.busy = true; sync.err = null; updateStatus();
  try {
    await gh.ensureBranch();
    const r = await gh.getState();
    sync.busy = false;
    if (r.missing){ sync.dirty = true; await sync.run(); if (opts.verbose) toast("Collegato: stato creato su GitHub"); }
    else {
      const rem = merge(r.state);
      if (opts.force || (rem.updatedAt || 0) > (S.updatedAt || 0)){ S = rem; localOk = ls.set(LS_STATE, JSON.stringify(S)); sync.last = new Date(); render(); toast("Caricato lo stato da GitHub"); }
      else if ((rem.updatedAt || 0) < (S.updatedAt || 0)){ sync.dirty = true; await sync.run(); if (opts.verbose) toast("Collegato: GitHub aggiornato con i dati di questo dispositivo"); }
      else { sync.last = new Date(); if (opts.verbose) toast("Collegato: già tutto allineato"); }
    }
  } catch(e){ sync.busy = false; sync.err = e.message || String(e); if (opts.verbose) toast(sync.err); }
  updateStatus();
}

function statusInfo(){
  if (!gh.ok()) return localOk ? {cls:"st-local", txt:"Salvato sul dispositivo"} : {cls:"st-err", txt:"Non salvato!"};
  if (sync.err) return {cls:"st-err", txt:"GitHub: errore"};
  if (sync.busy || sync.dirty) return {cls:"st-busy", txt:"Salvo su GitHub"};
  if (sync.last) return {cls:"st-ok", txt:"GitHub " + sync.last.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"})};
  return {cls:"st-busy", txt:"GitHub"};
}

/* ---------- calcoli ---------- */
const mult = fv => fv >= PRICE.sogliaBig ? PRICE.moltBig : (fv >= PRICE.sogliaMedi ? PRICE.moltMedi : PRICE.moltBassi);
const aggr = () => S.set.stile === "Prudente" ? 0.9 : (S.set.stile === "Aggressivo" ? 1.1 : 1);
const market = p => Math.max(1, Math.round(p.fv/1000 * S.set.budget * mult(p.fv)));
const mustOf = n => S.must.find(m => m.n === n);
const mineOf = n => S.mine.find(x => x.n === n);
const assigned = n => !!mineOf(n) || !!S.asg[n];
const isPor = n => { const p = byName.get(n); if (p) return p.tr === "Por"; const m = mineOf(n); return !!(m && m.por); };
const resOf = m => m.max > 0 ? m.max : (byName.get(m.n) ? Math.round(market(byName.get(m.n))*PRICE.extraMust) : 0);
const rolesOf = p => (p && p.r ? p.r.split(";").filter(Boolean) : []);
const teamAvoid = p => !!(p && !mustOf(p.n) && (CFG.evitaSquadre || []).includes(p.t));
const lastResortPrice = () => Math.max(1, +(CFG.ultimaSpiaggia && CFG.ultimaSpiaggia.prezzo) || 1);
function roleCountMine(r){ return S.mine.filter(x => { const p=byName.get(x.n); return p ? rolesOf(p).includes(r) : (r === "Por" && x.por); }).length; }
function freeGoodForRole(r){ return P.filter(p => !assigned(p.n) && rolesOf(p).includes(r) && p.sc >= 60 && /^Titolare/.test(p.s || "")).length; }
function assignedRoleCount(r){ let n=0; S.mine.forEach(x=>{ const p=byName.get(x.n); if (p && rolesOf(p).includes(r)) n++; }); Object.keys(S.asg).forEach(k=>{ const p=byName.get(k); if (p && rolesOf(p).includes(r)) n++; }); return n; }
function scarcityFor(r){
  const min=+MINS[r]||0; if (!min) return {r,free:freeGoodForRole(r),need:0,ratio:99,level:"ok"};
  const need=Math.max(0, TEAMS.length*min-assignedRoleCount(r)), free=freeGoodForRole(r), ratio=need ? free/need : 99;
  return {r,free,need,ratio,level: need && free < need ? "stop" : (need && free <= need*1.20 ? "warn" : "ok")};
}
function scarcityForPlayer(p){ const xs=rolesOf(p).filter(r => (+MINS[r]||0)>0).map(scarcityFor); if (!xs.length) return null; return xs.sort((a,b)=>a.ratio-b.ratio)[0]; }
function scarcityFactor(p){ const x=scarcityForPlayer(p); return !x ? 1 : (x.level === "stop" ? 1.08 : (x.level === "warn" ? 1.04 : 1)); }
const baseMax = p => Math.min(Math.round(S.set.tetto/100 * S.set.budget), Math.max(1, Math.round(market(p) * p.f * aggr() * scarcityFactor(p))));
const maxFor = p => { const m = mustOf(p.n); return m ? (m.max > 0 ? m.max : Math.max(Math.round(market(p)*PRICE.extraMust), baseMax(p))) : (teamAvoid(p) ? lastResortPrice() : baseMax(p)); };
const consOf = p => mustOf(p.n) ? "MUST" : (S.black.includes(p.n) ? "EVITA (scelta nostra)" : (teamAvoid(p) ? "EVITA (Juve/Lazio) — ultima spiaggia" : p.c));

function me(){
  const spent = S.mine.reduce((a,x) => a + (+x.p||0), 0);
  const por = S.mine.filter(x => isPor(x.n)).length, tot = S.mine.length, mov = tot - por;
  const rem = S.set.budget - spent, porMiss = Math.max(0, RULES.porMin-por), movMiss = Math.max(0, RULES.movMin-mov);
  const tecPor = (por >= RULES.porMax || tot >= RULES.rosaMax) ? 0 : Math.max(0, rem - (Math.max(0, porMiss-1) + movMiss));
  const tecMov = (mov >= RULES.movMax || tot >= RULES.rosaMax) ? 0 : Math.max(0, rem - (porMiss + Math.max(0, movMiss-1)));
  const mustRes = S.must.filter(m => !mineOf(m.n) && !S.asg[m.n]).reduce((a,m) => a + resOf(m), 0);
  const finRes = movMiss <= 3 ? 0 : Math.min(+S.set.riserva||0, Math.max(0, rem - (porMiss + movMiss)));
  return {spent, por, mov, tot, rem, porMiss, movMiss, tecPor, tecMov, mustRes, finRes,
    consPor: Math.max(0, tecPor - mustRes - finRes), consMov: Math.max(0, tecMov - mustRes - finRes)};
}
function rivSlots(r){ const mov=Math.max(0,r.g-r.p); return Math.max(0,RULES.porMin-r.p)+Math.max(0,RULES.movMin-mov); }
function rivalPower(r){ return r.c / Math.max(1, rivSlots(r)); }
function rivMax(r, portiere){
  const mov = Math.max(0, r.g - r.p), porMiss = Math.max(0, RULES.porMin - r.p), movMiss = Math.max(0, RULES.movMin - mov);
  if (portiere) return (r.p >= RULES.porMax || r.g >= RULES.rosaMax) ? 0 : Math.max(0, r.c - (Math.max(0, porMiss-1) + movMiss));
  return (mov >= RULES.movMax || r.g >= RULES.rosaMax) ? 0 : Math.max(0, r.c - (porMiss + Math.max(0, movMiss-1)));
}
function topRival(portiere){ let best = {t:"-", v:0}; for (const t of RIVALS){ const v = rivMax(S.riv[t] || {c:S.set.budget,g:0,p:0}, portiere); if (v > best.v) best = {t, v}; } return best; }
function auctionStats(){
  const m=me(), tracked=S.mine.length+Object.keys(S.asg).length, target=TEAMS.length*(+S.set.target||27), totalBudget=TEAMS.length*S.set.budget;
  const residual=m.rem+RIVALS.reduce((a,t)=>a+(+S.riv[t].c||0),0), spentPct=Math.max(0,Math.min(100,Math.round((1-residual/totalBudget)*100)));
  const comp=Math.min(100,Math.round(tracked/Math.max(1,target)*100));
  const paid=[]; S.mine.forEach(x=>{ const p=byName.get(x.n); if(p && +x.p>0) paid.push([+x.p,market(p)]); }); Object.entries(S.asg).forEach(([n,a])=>{ const p=byName.get(n); if(p && +a.p>0) paid.push([+a.p,market(p)]); });
  const inflN=paid.length, infl=inflN ? paid.reduce((a,x)=>a+x[0],0)/Math.max(1,paid.reduce((a,x)=>a+x[1],0)) : 1;
  const ourSlots=Math.max(1,m.porMiss+m.movMiss), ourPower=m.rem/ourSlots;
  const rp=RIVALS.map(t=>rivalPower(S.riv[t])); const avgPower=rp.reduce((a,x)=>a+x,0)/Math.max(1,rp.length);
  return {tracked,target,comp,spentPct,infl,inflN,ourPower,avgPower};
}
function budgetArea(p){ if(!p) return "Altro"; if(p.tr==="Por") return "Por"; if(["Dc","B","Dd","Ds","E"].includes(p.tr)) return "Difesa"; if(["M","C"].includes(p.tr)) return "Centrocampo"; if(["W","T"].includes(p.tr)) return "Trequarti"; if(["A","Pc"].includes(p.tr)) return "Attacco"; return "Altro"; }
function budgetStatus(){ const profile=(CFG.budgetReparti||{})[S.set.profiloBudget] || (CFG.budgetReparti||{}).Equilibrato || {}; const spent={Por:0,Difesa:0,Centrocampo:0,Trequarti:0,Attacco:0}; S.mine.forEach(x=>{ const a=budgetArea(byName.get(x.n)); if(a in spent) spent[a]+=+x.p||0; }); return Object.keys(spent).map(a=>({a,spent:spent[a],pct:+profile[a]||0,target:Math.round(S.set.budget*(+profile[a]||0)/100)})); }
function holeRisks(){ return ROLES.filter(r=>(+MINS[r]||0)>0).map(r=>({r,miss:Math.max(0,MINS[r]-roleCountMine(r)),free:freeGoodForRole(r)})).filter(x=>x.miss>0 && x.free<=Math.max(3,x.miss*2)).sort((a,b)=>(a.free/a.miss)-(b.free/b.miss)); }
function closingCandidates(){
  const missRoles=new Set(ROLES.filter(r=>(+MINS[r]||0)>roleCountMine(r)));
  return P.filter(p=>!assigned(p.n) && !teamAvoid(p) && !S.black.includes(p.n) && market(p)<=3 && rolesOf(p).some(r=>missRoles.has(r)))
    .map(p=>({p,cover:rolesOf(p).filter(r=>missRoles.has(r)).length})).sort((a,b)=>b.cover-a.cover || b.p.sc-a.p.sc).slice(0,8);
}
function alternatives(p,n=3){
  const rr=new Set(rolesOf(p)); return P.filter(x=>x.n!==p.n && !assigned(x.n) && !teamAvoid(x) && !S.black.includes(x.n) && x.tr===p.tr)
    .sort((a,b)=>b.sc-a.sc || market(a)-market(b)).slice(0,n);
}
function verdict(p){
  const own = mineOf(p.n), gone = S.asg[p.n];
  if (own) return {cls:"own", what:"Già nostro", price: own.p, lab:"pagato"};
  if (gone) return {cls:"gone", what:"Andato a " + (gone.t || "un'altra squadra"), price: gone.p || "", lab: gone.p ? "crediti" : ""};
  const m = me(), por = p.tr === "Por", mx = maxFor(p), cons = consOf(p), must = mustOf(p.n), sca=scarcityForPlayer(p);
  let off = por ? m.consPor : m.consMov;
  if (must) off = Math.max(0, (por ? m.tecPor : m.tecMov) - m.finRes - (m.mustRes - resOf(must)));
  const lim = Math.min(mx, off), tr = topRival(por);
  let tip = tr.v === 0 ? "" : (tr.v < lim ? `Nessun rivale può superare ${tr.v}: basta offrire ${tr.v + 1}.` : `Il rivale più ricco (${tr.t}) può arrivare a ${tr.v}.`);
  if (sca && sca.level !== "ok") tip += ` Scarsità ${sca.r}: ${sca.free} titolari buoni liberi per ~${sca.need} slot ancora da coprire in lega.`;
  if (mx > off && off > 0) tip += " Il limite è dato dai tuoi crediti, non dal valore.";
  if (!must && !teamAvoid(p) && market(p) > mx * 1.3) tip += ` Mercato stimato ${market(p)}: probabilmente andrà oltre il tuo tetto.`;
  if (S.black.includes(p.n)) return {cls:"stop", what:"Lascia", price:"", lab:"", tip:"È nella vostra lista manuale da evitare."};
  if (off <= 0) return {cls:"stop", what:"Non puoi", price:"", lab:"", tip:"Crediti finiti o ruolo già pieno."};
  if (teamAvoid(p)) return {cls:"stop", what:"Evita — ultima spiaggia", price:Math.min(lastResortPrice(),off), lab:"max", tip:(CFG.ultimaSpiaggia && CFG.ultimaSpiaggia.testo) || "Solo se sei costretto a chiudere la rosa."};
  if (cons.startsWith("EVITA")) return {cls:"stop", what:"Lascia", price:"", lab:"", tip:"Sconsigliato (infortunio lungo o giocatore a rischio)."};
  if (must) return {cls:"must", what:"MUST: prendilo", price: lim, lab:"fino a", tip};
  if (/^(TOP|OBIETTIVO|BUONO)/.test(cons)) return {cls:"go", what:"Prendi", price: lim, lab:"fino a", tip};
  if (cons.startsWith("OCCASIONE")) return {cls:"warn", what:"Occasione, solo a sconto", price: lim, lab:"fino a", tip};
  return {cls:"warn", what:"Solo se costa poco", price: lim, lab:"fino a", tip};
}

function lineTeamMatch(line){
  const nl=" "+norm(line)+" "; let best=null;
  for(const t of TEAMS){ const nt=" "+norm(t)+" "; if(nl.includes(nt) && (!best || t.length>best.length)) best=t; }
  return best;
}
function playerFromLooseLine(line, team){
  let cleaned=line;
  if(team){ const re=new RegExp(team.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"); cleaned=cleaned.replace(re," "); }
  cleaned=cleaned.replace(/\b(?:crediti?|cr|giocatori?|gioc\.?|rosa|portieri?|por|prezzo|pagato|squadra|team)\b\s*[:=-]?\s*\d*/gi," ").replace(/\b\d+\b/g," ").replace(/[;|,·:\-]+/g," ").replace(/\s+/g," ").trim();
  if(!cleaned) return {p:null};
  let mp=matchPlayer(cleaned); if(mp.p) return mp;
  const words=cleaned.split(" ");
  for(let len=Math.min(4,words.length);len>=1;len--){ for(let i=0;i+len<=words.length;i++){ mp=matchPlayer(words.slice(i,i+len).join(" ")); if(mp.p) return mp; } }
  return {p:null};
}
function parseImport(text){
  const out={riv:[],asg:[],bad:[]};
  for(let line of text.split(/\r?\n/)){
    line=line.replace(/^\s*(?:[-*•]|\d+[.)])\s+/,"").replace(/\*\*/g,"").trim().replace(/^\|/,"").replace(/\|$/,"").trim();
    if(!line||/^\|?\s*:?-{2,}/.test(line)) continue;
    let parts=/[;|\t]/.test(line)?line.split(/[;|\t]/):line.split(","); parts=parts.map(s=>s.trim()); const nonEmpty=parts.filter(Boolean);
    if(!nonEmpty.length||/^(squadra|giocatore|team|nome)$/i.test(norm(nonEmpty[0]))) continue;
    const nums=nonEmpty.map(s=>/^\d+$/.test(s.replace(/\s/g,""))?+s.replace(/\s/g,""):null), team0=matchTeam(nonEmpty[0]);
    if(team0 && nums[1]!==null && nums[1]!==undefined){ const na=parts.slice(1).map(s=>/^\d+$/.test(s.replace(/\s/g,""))?+s.replace(/\s/g,""):null); out.riv.push({t:team0,c:na[0],g:na[1]??null,p:na[2]??null,raw:line}); continue; }
    let team=null,name=null,price=null;
    nonEmpty.forEach((x,i)=>{ if(nums[i]!==null) price=nums[i]; else if(!team && matchTeam(x) && !matchPlayer(x).p) team=matchTeam(x); else if(!name) name=x; });
    if(name){ const mp=matchPlayer(name); if(mp.p){ out.asg.push({n:mp.p.n,t:team,pr:price,raw:name}); continue; } }
    // S1: fallback tollerante per Live Text / testo grezzo senza separatori puliti.
    const looseTeam=lineTeamMatch(line); const looseNums=(line.match(/\b\d+\b/g)||[]).map(Number); const mp=playerFromLooseLine(line,looseTeam);
    if(mp.p){ out.asg.push({n:mp.p.n,t:looseTeam,pr:looseNums.length?looseNums[looseNums.length-1]:null,raw:line}); continue; }
    if(looseTeam && looseNums.length){ out.riv.push({t:looseTeam,c:looseNums[0],g:looseNums.length>1?looseNums[1]:null,p:looseNums.length>2?looseNums[2]:null,raw:line}); continue; }
    out.bad.push(line+(mp.amb?"  (ambiguo: "+mp.amb.join(", ")+")":""));
  }
  // ultima riga vince solo per i campi presenti; applyImport fa il merge conservativo
  return out;
}
function removeKnownAssignment(n, touchRival=true){
  const i=S.mine.findIndex(x=>x.n===n); if(i>=0) S.mine.splice(i,1);
  const a=S.asg[n]; if(a){ if(touchRival && a.s && a.t && +a.p>0 && S.riv[a.t]){ const r=S.riv[a.t]; r.c+=+a.p; r.g=Math.max(0,r.g-1); if(isPor(n)) r.p=Math.max(0,r.p-1); } delete S.asg[n]; }
}

    else{
      const a={t:newTeam||"",p:newPrice||""};
      if(scala && newTeam && newPrice && !snapTeams.has(newTeam) && S.riv[newTeam]){ const r=S.riv[newTeam]; r.c-=newPrice; r.g+=1; if(isPor(x.n)) r.p+=1; a.s=1; }
      S.asg[x.n]=a; logEvent("altri (foto/integrazione)",x.n,newTeam,newPrice||"");
    }
    changed++; if(addsInfo) completed++; else if(hadKnown) corrected++;
  });
  ip.riv.forEach(x=>{
    if(x.t===NOI||!S.riv[x.t]) return; const r=S.riv[x.t];
    // Snapshot squadra: sovrascrive solo i valori visibili; i vuoti restano invariati.
    if(x.c!==null&&x.c!==undefined) r.c=x.c;
    if(x.g!==null&&x.g!==undefined) r.g=x.g;
    if(x.p!==null&&x.p!==undefined) r.p=x.p;
  });
  if(ip.riv.length){ S.upd=now; logEvent("snapshot rivali","","",ip.riv.length+" squadre"); }
  importPreview=null;
  commit(`Foto integrata: ${ip.riv.length} squadre, ${changed} assegnazioni (${completed} completate, ${corrected} corrette)`);
}

  h += `<h3>Shortlist Piano A / B / C</h3>`;
  const groups = {}; SHORT.forEach(([rep, piano, n]) => (groups[rep] = groups[rep] || []).push([piano, n]));
  for (const [rep, items] of Object.entries(groups)){

  }

}

async function shareState(){
  const html=stateSnapshotHTML(), stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,"-"), name=`AS-Pinta-stato-${stamp}.html`;
  const file=new File([html],name,{type:"text/html"});
  try{
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({title:"AS Pinta · stato asta",text:"Stato aggiornato AS Pinta",files:[file]}); toast("Stato condiviso"); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},700); toast("HTML dello stato scaricato");
}

async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast("Copiato"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(_) {} ta.remove(); toast(ok ? "Copiato" : "Copia non riuscita: seleziona il testo a mano"); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if ("undolast" in d){ undoLast(); return; }
  if ("sharestate" in d){ shareState(); return; }
  if ("auctionmode" in d){ auctionMode=!auctionMode; render(); setTimeout(()=>$("#q")&&$("#q").focus(),30); return; }
  if (d.tab){ tab = d.tab; if (tab !== "cerca") selected = null; resetArm = false; render(); window.scrollTo(0,0); if (tab === "cerca") setTimeout(() => $("#q") && $("#q").focus(), 30); return; }
  if (d.open){ selected = d.open; tab = "cerca"; render(); window.scrollTo(0,0); return; }
  if ("back" in d){ selected = null; query = ""; render(); setTimeout(() => $("#q").focus(), 30); return; }
  if (d.buy){ const pr = parseInt($("#price").value, 10); if (!(pr > 0)){ toast("Scrivi il prezzo pagato"); $("#price").focus(); return; } saveUndo(`acquisto ${d.buy}`); removeKnownAssignment(d.buy); S.mine.push({n: d.buy, p: pr}); logEvent("noi", d.buy, NOI, pr); selected = null; query = ""; commit(`${d.buy} preso a ${pr}`); setTimeout(()=>$("#q")&&$("#q").focus(),30); return; }
  if (d.other){ const t = $("#team").value, pr = parseInt($("#price").value, 10); saveUndo(`assegnazione ${d.other}`); removeKnownAssignment(d.other); const a = {t, p: pr > 0 ? pr : ""};
    if (t && pr > 0){ const r = S.riv[t]; r.c -= pr; r.g += 1; if (isPor(d.other)) r.p += 1; a.s = 1; }
    S.asg[d.other] = a; logEvent("altri", d.other, t, pr > 0 ? pr : ""); selected = null; query = ""; commit(`${d.other} segnato come preso${t ? " da " + t : ""}`); setTimeout(()=>$("#q")&&$("#q").focus(),30); return; }
  if (d.undo){ const n = d.undo; saveUndo(`annulla assegnazione ${n}`); const i = S.mine.findIndex(x => x.n === n); if (i >= 0) S.mine.splice(i, 1);
    const a = S.asg[n]; if (a){ if (a.s && a.t && a.p){ const r = S.riv[a.t]; r.c += +a.p; r.g -= 1; if (isPor(n)) r.p -= 1; } delete S.asg[n]; }
    logEvent("annulla", n); commit("Assegnazione annullata"); return; }
  if (d.must){ const i = S.must.findIndex(m => m.n === d.must); if (i >= 0) S.must.splice(i, 1); else { S.must.push({n: d.must, max: 0}); S.black = S.black.filter(x => x !== d.must); } commit(i >= 0 ? "Tolto dai MUST" : "Aggiunto ai MUST: imposta il prezzo in Obiettivi"); return; }
  if (d.black){ const i = S.black.indexOf(d.black); if (i >= 0) S.black.splice(i, 1); else { S.black.push(d.black); S.must = S.must.filter(m => m.n !== d.black); } commit(i >= 0 ? "Tolto da evitare" : "Messo tra da evitare"); return; }
  if (d.del){ saveUndo("rimozione dalla rosa"); S.mine.splice(+d.del, 1); commit("Tolto dalla rosa"); return; }
  if ("addx" in d){ const n = $("#xname").value.trim(), pr = parseInt($("#xprice").value, 10); if (!n || !(pr >= 0)){ toast("Scrivi nome e prezzo"); return; } saveUndo(`aggiunta ${n}`); S.mine.push({n, p: pr, por: $("#xpor").value === "1"}); commit(`${n} aggiunto`); return; }
  if (d.mustdel){ S.must.splice(+d.mustdel, 1); commit("Tolto dai MUST"); return; }
  if (d.blackdel){ S.black.splice(+d.blackdel, 1); commit("Tolto da evitare"); return; }
  if (d.role){ roleSel = d.role; render(); return; }
  if (d.copy){ copyText(d.copy === "squadre" ? PROMPT_SQUADRE() : PROMPT_GIOCATORI()); return; }
  if ("parse" in d){ const t = $("#paste").value; importPreview = parseImport(t); render(); const ta = $("#paste"); if (ta) ta.value = t; return; }
  if ("apply" in d){ if (importPreview) applyImport(importPreview); return; }
  if ("cancelimport" in d){ importPreview = null; render(); return; }
  if ("backup" in d){ copyText(enc(S)); return; }
  if ("restore" in d){ try { S = merge(dec($("#restore").value)); commit("Ripristinato dal backup"); } catch(err){ toast("Codice non valido: copialo di nuovo per intero"); } return; }
  if ("ghconnect" in d){
    const owner = $("#gh_owner").value.trim(), repo = $("#gh_repo").value.trim(), branch = IS_BETA ? "stato-beta" : ($("#gh_branch").value.trim() || CFG.github.branch), token = $("#gh_token").value.trim();
    if (!owner || !repo || !token){ toast("Servono utente, repository e token"); return; }
    ls.set(LS_GH, JSON.stringify({owner, repo, branch, token, file: CFG.github.file}));
    toast("Collegamento in corso"); connectAndPull({verbose: true}).then(render); return; }
  if ("ghpush" in d){ sync.dirty = true; sync.run().then(() => { render(); toast(sync.err ? sync.err : "Salvato su GitHub"); }); return; }
  if ("ghpull" in d){ connectAndPull({verbose: true, force: true}).then(render); return; }
  if ("ghoff" in d){ ls.del(LS_GH); sync.err = null; sync.last = null; render(); toast("GitHub scollegato da questo dispositivo"); return; }
  if ("download" in d){
    const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `asta-as-pinta-${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); return; }
  if ("seedcfg" in d){
    let n = 0;
    (CFG.must || []).filter(m => m && m.n).forEach(m => { const cur = mustOf(m.n); if (cur){ if (+m.max > 0) cur.max = +m.max; } else { S.must.push({n: m.n, max: +m.max || 0, why: m.why || ""}); n++; } S.black = S.black.filter(x => x !== m.n); });
    (CFG.evita || []).filter(Boolean).forEach(x => { if (!S.black.includes(x)){ S.black.push(x); S.must = S.must.filter(m => m.n !== x); n++; } });
    const unknown = [...(CFG.must || []).filter(m => m && m.n).map(m => m.n), ...(CFG.evita || [])].filter(x => !byName.has(x));
    commit(`Importati ${n} nomi da config.json` + (unknown.length ? `. Non nel listone: ${unknown.join(", ")}` : "")); return; }
  if ("reset" in d){ if (!resetArm){ resetArm = true; render(); return; } S = defaults(); ls.del(LS_UNDO); resetArm = false; selected = null; query = ""; commit("Tutto azzerato"); return; }
});

  if (e.key === "F1"){ e.preventDefault(); undoLast(); return; }
  if (e.key === "F4"){ e.preventDefault(); auctionMode=!auctionMode; render(); return; }
  if (e.key === "Enter" && e.target.id === "q"){ const r = searchPlayers(query); if (r.length){ selected = r[0].n; render(); } }
});

function validateData(players,cfg,shortlist){
  const errors=[], warnings=[];
  if(!Array.isArray(players)||!players.length) errors.push("players.json è vuoto o non è un array");
  if(!cfg||!Array.isArray(cfg.squadre)||!cfg.squadre.length) errors.push("config.json: elenco squadre mancante");
  if(cfg && (!cfg.noi || !(cfg.squadre||[]).includes(cfg.noi))) errors.push("config.json: 'noi' non compare nell'elenco squadre");
  if(cfg && new Set(cfg.squadre||[]).size!==(cfg.squadre||[]).length) errors.push("config.json: ci sono squadre duplicate");
  const names=(players||[]).map(x=>x&&x.n).filter(Boolean), set=new Set(names);
  if(set.size!==names.length) errors.push("players.json: ci sono nomi giocatore duplicati");
  (players||[]).forEach((x,i)=>{ if(!x||!x.n||!x.r||x.fv===undefined) warnings.push(`players.json riga ${i+1}: campi essenziali incompleti`); });
  const cfgNames=[...(cfg&&cfg.must||[]).map(x=>x&&x.n).filter(Boolean),...(cfg&&cfg.evita||[]).filter(Boolean)];
  cfgNames.filter(n=>!set.has(n)).forEach(n=>warnings.push(`config.json: '${n}' non esiste nel listone`));
  (shortlist||[]).forEach(x=>{ if(Array.isArray(x)&&x[2]&&!set.has(x[2])) warnings.push(`shortlist: '${x[2]}' non esiste nel listone`); });
  if(cfg&&(+cfg.impostazioni?.budget||0)<=0) errors.push("config.json: budget non valido");
  if(cfg&&cfg.budgetReparti){ Object.entries(cfg.budgetReparti).filter(([k])=>!k.startsWith("_")).forEach(([k,v])=>{ const sum=Object.values(v||{}).reduce((a,n)=>a+(+n||0),0); if(Math.abs(sum-100)>1) warnings.push(`Profilo budget '${k}' somma ${sum}% invece di 100%`); }); }
  return {errors,warnings:[...new Set(warnings)].slice(0,20)};
}

function fatal(msg){
  document.getElementById("app").innerHTML = `<div class="card" style="margin-top:20px"><h2 style="margin-top:0">L'app non riesce a partire</h2><p>${esc(msg)}</p><p class="small">Aprila dal link di GitHub Pages (non come file sul dispositivo) e controlla che nel repo ci sia la cartella <b>data</b> con players.json, config.json e shortlist.json.</p></div>`;
}
async function fetchJSON(path){ const r = await fetch(`${path}?v=${Date.now()}`, {cache: "no-store"}); if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.json(); }
async function boot(){
  try {
    const [players, cfg, shortlist] = await Promise.all([fetchJSON("data/players.json"), fetchJSON("data/config.json"), fetchJSON("data/shortlist.json")]);
    const check=validateData(players,cfg,shortlist); if(check.errors.length){ fatal("Controllo dati fallito: "+check.errors.join(" · ")); return; } DATA_WARNINGS=check.warnings;
    init(players, cfg, shortlist);
    ls.set(LS_CACHE, JSON.stringify({players, cfg, shortlist, at: Date.now()}));
  } catch(e){
    const cached = ls.get(LS_CACHE);
    if (!cached){ fatal("Non riesco a leggere i file dati (" + (e.message || e) + ")."); return; }
    try { const o = JSON.parse(cached); const check=validateData(o.players,o.cfg,o.shortlist); if(check.errors.length){ fatal("Copia dati non valida: "+check.errors.join(" · ")); return; } DATA_WARNINGS=check.warnings; init(o.players, o.cfg, o.shortlist); dataFromCache = true; } catch(err){ fatal("Copia dei dati danneggiata."); return; }
  }
  loadLocal();
  if (!ls.set(IS_BETA ? "astaPinta.beta.test" : "astaPinta.test", "1")) localOk = false;
  render();
  if (dataFromCache) toast("Offline: uso la copia dei dati salvata");
  if (gh.ok()) connectAndPull();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && sync.dirty && gh.ok()){ clearTimeout(sync.timer); sync.run(); } });
window.addEventListener("online", () => { if (sync.dirty && gh.ok()) sync.run(); });
boot();

</script>
